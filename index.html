<!DOCTYPE html>
<html lang="de">

<title>Forderungen</title>
<style>
:root{--bg:#111418;--panel:#1b2027;--panel2:#232a33;--line:#343d49;--text:#f1f3f5;--muted:#9aa4b2;--accent:#d7a63a;--good:#4f8c63;--bad:#b95b4a;--shadow:0 10px 30px rgba(0,0,0,.28);--r:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
html[data-theme=light]{--bg:#f2f4ef;--panel:#fff;--panel2:#f7f8f5;--line:#d9ded3;--text:#20241f;--muted:#697166;--accent:#a46f11;--good:#39714a;--bad:#9d4738;--shadow:0 10px 28px rgba(0,0,0,.08)}
@media(prefers-color-scheme:light){html:not([data-theme]){--bg:#f2f4ef;--panel:#fff;--panel2:#f7f8f5;--line:#d9ded3;--text:#20241f;--muted:#697166;--accent:#a46f11;--good:#39714a;--bad:#9d4738;--shadow:0 10px 28px rgba(0,0,0,.08)}}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top{max-width:980px;margin:auto;padding:12px 14px;display:flex;gap:10px;align-items:center}.brand{font-size:20px;font-weight:800;flex:1;min-width:0}.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}.brand span{color:var(--accent)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#201806;font-weight:800}.good{background:var(--good);border-color:var(--good);color:#fff;font-weight:800}.danger{color:var(--bad)}.fs{max-width:980px;margin:auto;padding:0 14px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.fs b{color:var(--text)}.state{padding:3px 8px;border-radius:999px;color:#fff}.clean{background:var(--good)}.dirty{background:var(--bad)}main{max-width:980px;margin:auto;padding:16px 14px 90px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat .n{font-size:22px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);margin-top:3px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea,.setting-row input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px}.toolbar input{flex:1;min-width:180px}.list{display:flex;flex-direction:column;gap:10px}.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}.ih{display:flex;gap:10px;align-items:flex-start}.im{flex:1}.title{font-weight:800;font-size:17px}.amount{font-size:20px;font-weight:900;color:var(--accent)}.meta{font-size:13px;color:var(--muted);margin-top:5px}.note{margin-top:8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:48px}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:50%;background:var(--accent);font-size:32px;box-shadow:var(--shadow)}.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.mh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);z-index:2}.mh h2{margin:0;font-size:19px;flex:1}.mb{padding:16px}.mf{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;justify-content:flex-end}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%}input[type=datetime-local]{min-width:0;-webkit-appearance:none;appearance:none}.field textarea{min-height:80px}.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.box h3{margin:0 0 10px}.rows{display:flex;flex-direction:column;gap:8px}.setting-row{display:flex;gap:8px}.setting-row input{flex:1}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;z-index:80}.toast.show{opacity:1}.hidden{display:none!important}@media(min-width:720px){.ov{align-items:center;padding:30px}.modal{border-radius:18px;border-bottom:1px solid var(--line)}}@media(max-width:620px){body{width:100%}.top{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 12px}.brand{font-size:18px;line-height:1.15}.top-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:7px}.top-actions .btn{min-width:0;width:100%;padding:10px 4px;font-size:19px;line-height:1}.top .txt{display:none}.fs{padding:0 12px 9px;font-size:11px;gap:6px}.fs b{max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{width:100%;padding:12px 12px 110px}.summary{grid-template-columns:1fr 1fr;gap:8px}.summary .stat:last-child{grid-column:1/-1}.stat{padding:11px}.stat .n{font-size:19px}.tabs{gap:6px}.tabs .btn{padding:10px 6px}.toolbar{display:grid;grid-template-columns:1fr;gap:8px}.toolbar input,.toolbar select{width:100%;min-width:0}.grid{grid-template-columns:1fr;min-width:0}.full{grid-column:auto}.ov{align-items:stretch;padding:0}.modal{width:100%;height:100dvh;max-height:100dvh;border-radius:0;border:0;display:flex;flex-direction:column;overflow:hidden;min-width:0}.mh{padding:14px 12px;flex-shrink:0}.mh h2{font-size:20px;min-width:0}.mh .btn{width:48px;height:48px;padding:0;font-size:20px}.mb{padding:14px 12px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;-webkit-overflow-scrolling:touch}.mf{position:relative;bottom:auto;flex-shrink:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.4fr;gap:8px;z-index:5}.mf .btn{min-height:50px;font-size:16px}.field input,.field select,.field textarea{font-size:16px}.field textarea{min-height:92px}.fab{right:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:62px;height:62px;font-size:34px;z-index:18}}@media(max-width:620px) and (display-mode:standalone){.fab{bottom:calc(18px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">Meine <span>Forderungen</span></div><div class="top-actions"><button class="btn" id="fileBtn" aria-label="Datendatei öffnen" title="Datendatei öffnen">📂 <span class="txt">Datei</span></button><button class="btn" id="quickExportBtn" aria-label="JSON in Dateien sichern" title="JSON in Dateien sichern">💾 <span class="txt">JSON</span></button><button class="btn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">⚙️</button><button class="btn" id="themeBtn" aria-label="Darstellung wechseln" title="Darstellung wechseln">☀️</button></div></div><div class="fs"><span>Datendatei:</span><b id="fileName">Browser-Zwischenspeicher</b><span id="saveState" class="state clean">im Browser</span></div></header>
<main><div class="summary"><div class="stat"><div class="n" id="sumOpen">0,00 €</div><div class="l">Offen gesamt</div></div><div class="stat"><div class="n" id="countOpen">0</div><div class="l">Offene Forderungen</div></div><div class="stat"><div class="n" id="countPaid">0</div><div class="l">Erledigt</div></div></div><div class="tabs"><button class="btn primary" data-tab="open">Offen</button><button class="btn" data-tab="paid">Erledigt</button><button class="btn" data-tab="all">Alle</button></div><div class="toolbar"><input id="search" placeholder="Suchen: Person, Laden, Notiz…"><select id="personFilter"><option value="">Alle Personen</option></select></div><div id="list" class="list"></div></main>
<button class="fab" id="addBtn">＋</button><input type="file" id="jsonInput" accept="application/json,.json" multiple class="hidden"><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const LS='forderungen_cache_v2',LM='forderungen_meta_v2';let S={data:{version:1,personen:['Tommy'],laeden:['Netto'],forderungen:[]},tab:'open',q:'',person:'',file:'Browser-Zwischenspeicher',dirty:false};const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}function cache(){try{localStorage.setItem(LS,JSON.stringify(S.data));localStorage.setItem(LM,JSON.stringify({file:S.file,dirty:S.dirty}))}catch(e){}}function load(){try{const d=localStorage.getItem(LS),m=localStorage.getItem(LM);if(d)S.data=JSON.parse(d);if(m){const x=JSON.parse(m);S.file=x.file||S.file;S.dirty=!!x.dirty}}catch(e){}}function dirty(){S.dirty=true;cache();fileStatus()}function fileStatus(){$('#fileName').textContent=S.file;const e=$('#saveState');e.textContent=S.dirty?'Änderungen nur im Browser':'Export zuletzt erstellt';e.className='state '+(S.dirty?'dirty':'clean')}function money(n){return Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function fmt(v){if(!v)return '—';return new Date(v).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}function localDT(d=new Date()){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function toInput(v){return localDT(new Date(v))}function id(){return 'F-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}function render(){const open=S.data.forderungen.filter(x=>x.status!=='bezahlt'),paid=S.data.forderungen.filter(x=>x.status==='bezahlt');$('#sumOpen').textContent=money(open.reduce((a,x)=>a+Number(x.betrag||0),0));$('#countOpen').textContent=open.length;$('#countPaid').textContent=paid.length;const pf=$('#personFilter');pf.innerHTML='<option value="">Alle Personen</option>'+S.data.personen.map(p=>`<option>${esc(p)}</option>`).join('');pf.value=S.person;fileStatus();renderList()}function filtered(){let r=[...S.data.forderungen];if(S.tab==='open')r=r.filter(x=>x.status!=='bezahlt');if(S.tab==='paid')r=r.filter(x=>x.status==='bezahlt');if(S.person)r=r.filter(x=>x.person===S.person);const q=S.q.trim().toLowerCase();if(q)r=r.filter(x=>[x.person,x.laden,x.notiz,x.betrag,fmt(x.einkauf),fmt(x.rueckzahlung)].join(' ').toLowerCase().includes(q));return r.sort((a,b)=>new Date(b.einkauf)-new Date(a.einkauf))}function renderList(){const r=filtered(),h=$('#list');if(!r.length){h.innerHTML='<div class="empty">Keine passenden Forderungen.</div>';return}h.innerHTML=r.map(x=>`<div class="item"><div class="ih"><div class="im"><div class="title">${esc(x.person)} · ${esc(x.laden)}</div><div class="meta">Einkauf: ${esc(fmt(x.einkauf))}</div>${x.status==='bezahlt'?`<div class="meta">Bezahlt: ${esc(fmt(x.rueckzahlung))}</div>`:''}${x.notiz?`<div class="note">${esc(x.notiz)}</div>`:''}</div><div class="amount">${money(x.betrag)}</div></div><div class="acts">${x.status!=='bezahlt'?`<button class="btn good" data-paid="${x.id}">✓ Bezahlt</button>`:`<span class="badge">erledigt</span><button class="btn" data-reopen="${x.id}">Wieder öffnen</button>`}<button class="btn" data-edit="${x.id}">Bearbeiten</button><button class="btn danger" data-del="${x.id}">Löschen</button></div></div>`).join('');$$('[data-paid]').forEach(b=>b.onclick=()=>{const x=S.data.forderungen.find(v=>v.id===b.dataset.paid);x.status='bezahlt';x.rueckzahlung=new Date().toISOString();dirty();render();toast('Als bezahlt markiert')});$$('[data-reopen]').forEach(b=>b.onclick=()=>{const x=S.data.forderungen.find(v=>v.id===b.dataset.reopen);x.status='offen';x.rueckzahlung='';dirty();render()});$$('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Diesen Eintrag wirklich löschen?')){S.data.forderungen=S.data.forderungen.filter(x=>x.id!==b.dataset.del);dirty();render()}})}function modal(title,body,onSave,label='Speichern'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="modal"><div class="mh"><h2>${esc(title)}</h2><button class="btn" data-close>✕</button></div><div class="mb">${body}</div><div class="mf"><button class="btn" data-close>Abbrechen</button><button class="btn primary" data-save>${esc(label)}</button></div></div>`;document.body.appendChild(o);o.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>o.remove());o.querySelector('[data-save]').onclick=()=>onSave(o);return o}function form(x={}){return `<div class="grid"><div class="field"><label>Datum & Uhrzeit</label><input id="fdt" type="datetime-local" value="${esc(x.einkauf?toInput(x.einkauf):localDT())}"></div><div class="field"><label>Person</label><select id="fp">${S.data.personen.map(p=>`<option ${p===x.person?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field"><label>Laden</label><select id="fl">${S.data.laeden.map(p=>`<option ${p===x.laden?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field"><label>Betrag (€)</label><input id="fb" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(x.betrag??'')}"></div><div class="field full"><label>Notiz / Artikel</label><textarea id="fn">${esc(x.notiz||'')}</textarea></div></div>`}function add(){modal('Neue Forderung',form(),o=>{const b=Number(o.querySelector('#fb').value);if(!b)return toast('Bitte Betrag eingeben');S.data.forderungen.push({id:id(),einkauf:new Date(o.querySelector('#fdt').value).toISOString(),person:o.querySelector('#fp').value,laden:o.querySelector('#fl').value,betrag:b,notiz:o.querySelector('#fn').value.trim(),status:'offen',rueckzahlung:''});o.remove();dirty();render();toast('Forderung gespeichert')})}function edit(i){const x=S.data.forderungen.find(v=>v.id===i);modal('Forderung bearbeiten',form(x),o=>{x.einkauf=new Date(o.querySelector('#fdt').value).toISOString();x.person=o.querySelector('#fp').value;x.laden=o.querySelector('#fl').value;x.betrag=Number(o.querySelector('#fb').value);x.notiz=o.querySelector('#fn').value.trim();o.remove();dirty();render()})}function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportFilename(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `Forderungen_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}.json`}async function exportJSON(){const n=exportFilename();const text=JSON.stringify(S.data,null,2);const file=new File([text],n,{type:'application/json'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Forderungen sichern'});S.file=n;S.dirty=false;cache();fileStatus();toast('Export bereitgestellt – bitte in Dateien sichern');return}}catch(e){if(e&&e.name==='AbortError'){toast('Export abgebrochen');return}}download(text,n,'application/json;charset=utf-8');S.file=n;S.dirty=false;cache();fileStatus();toast('JSON heruntergeladen – Originaldatei wurde nicht automatisch ersetzt')}async function exportCSV(){const e=v=>{v=String(v??'');return /[;\"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},h=['ID','Einkauf','Person','Laden','Betrag','Notiz','Status','Rueckzahlung'];const lines=[h.join(';'),...S.data.forderungen.map(x=>[x.id,fmt(x.einkauf),x.person,x.laden,Number(x.betrag).toFixed(2).replace('.',','),x.notiz,x.status,x.rueckzahlung?fmt(x.rueckzahlung):''].map(e).join(';'))];const text='\ufeff'+lines.join('\r\n');const n=exportFilename().replace(/\.json$/i,'.csv');const file=new File([text],n,{type:'text/csv;charset=utf-8'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Forderungen CSV sichern'});toast('CSV bereitgestellt – bitte in Dateien sichern');return}}catch(e){if(e&&e.name==='AbortError'){toast('CSV-Export abgebrochen');return}}download(text,n,'text/csv;charset=utf-8');toast('CSV heruntergeladen')}function settings(){const body=`<div class="box"><h3>Personen</h3><div id="pr" class="rows"></div><div class="setting-row" style="margin-top:8px"><input id="np" placeholder="Neue Person"><button class="btn" id="ap">＋</button></div></div><div class="box"><h3>Läden</h3><div id="sr" class="rows"></div><div class="setting-row" style="margin-top:8px"><input id="ns" placeholder="Neuer Laden"><button class="btn" id="as">＋</button></div></div><div class="box"><h3>Daten</h3><div class="acts"><button class="btn" id="ej">JSON exportieren</button><button class="btn" id="ec">CSV exportieren</button><button class="btn" id="ij">JSON öffnen</button></div><div class="meta">JSON enthält Personen, Läden und alle Forderungen. Auf dem iPhone bitte beim Export „In Dateien sichern“ wählen und die vorhandene Forderungen.json im iCloud-Ordner ersetzen.</div></div>`;const o=modal('Einstellungen',body,m=>{m.remove();render()},'Fertig');function rr(){o.querySelector('#pr').innerHTML=S.data.personen.map((p,i)=>`<div class="setting-row"><input value="${esc(p)}" data-p="${i}"><button class="btn danger" data-pd="${i}">−</button></div>`).join('');o.querySelector('#sr').innerHTML=S.data.laeden.map((p,i)=>`<div class="setting-row"><input value="${esc(p)}" data-s="${i}"><button class="btn danger" data-sd="${i}">−</button></div>`).join('');o.querySelectorAll('[data-p]').forEach(e=>e.onchange=()=>{S.data.personen[+e.dataset.p]=e.value.trim();dirty()});o.querySelectorAll('[data-s]').forEach(e=>e.onchange=()=>{S.data.laeden[+e.dataset.s]=e.value.trim();dirty()});o.querySelectorAll('[data-pd]').forEach(e=>e.onclick=()=>{if(S.data.personen.length>1){S.data.personen.splice(+e.dataset.pd,1);dirty();rr()}});o.querySelectorAll('[data-sd]').forEach(e=>e.onclick=()=>{if(S.data.laeden.length>1){S.data.laeden.splice(+e.dataset.sd,1);dirty();rr()}})}rr();o.querySelector('#ap').onclick=()=>{const v=o.querySelector('#np').value.trim();if(v&&!S.data.personen.includes(v)){S.data.personen.push(v);dirty();o.querySelector('#np').value='';rr()}};o.querySelector('#as').onclick=()=>{const v=o.querySelector('#ns').value.trim();if(v&&!S.data.laeden.includes(v)){S.data.laeden.push(v);dirty();o.querySelector('#ns').value='';rr()}};o.querySelector('#ej').onclick=exportJSON;o.querySelector('#ec').onclick=exportCSV;o.querySelector('#ij').onclick=()=>$('#jsonInput').click()}function fileTime(f){const m=/Forderungen_(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})\.json$/i.exec(f.name);if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime();return f.lastModified||0}$('#jsonInput').onchange=e=>{const files=[...e.target.files];if(!files.length)return;const f=files.sort((a,b)=>fileTime(b)-fileTime(a))[0];const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.personen||!d.laeden||!d.forderungen)throw 0;S.data=d;S.file=f.name;S.dirty=false;cache();render();toast(files.length>1?'Neueste Datei geladen: '+f.name:'Datei geladen: '+f.name)}catch(x){alert('Die JSON-Datei hat nicht das erwartete Format.')}};r.readAsText(f);e.target.value=''};function theme(){const a=document.documentElement.getAttribute('data-theme');return a||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('forderungen_theme',t);$('#themeBtn').textContent=t==='light'?'🌙':'☀️'}const st=localStorage.getItem('forderungen_theme');if(st)setTheme(st);else $('#themeBtn').textContent=theme()==='light'?'🌙':'☀️';$('#addBtn').onclick=add;$('#settingsBtn').onclick=settings;$('#quickExportBtn').onclick=exportJSON;$('#fileBtn').onclick=()=>{if(!S.dirty||confirm('Es gibt noch nicht exportierte Änderungen. Trotzdem eine andere Datei öffnen?'))$('#jsonInput').click()};$('#themeBtn').onclick=()=>setTheme(theme()==='light'?'dark':'light');$('#search').oninput=e=>{S.q=e.target.value;renderList()};$('#personFilter').onchange=e=>{S.person=e.target.value;renderList()};$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');S.tab=b.dataset.tab;renderList()});window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});load();render()})();
</script>
</body>
</html>
